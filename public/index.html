<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Busaí SP</title>
  <meta http-equiv="refresh" content="0;url=https://busaisp.vercel.app" />
  <script>
    window.location.replace("https://busaisp.vercel.app");
  </script>
</head>
<body style="margin: 0; background: #0B0A14; color: #F5F3FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;">
  <div style="text-align: center;">
    <div style="width: 38px; height: 38px; border: 3px solid rgba(139, 116, 240, 0.2); border-top-color: #8B74F0; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px;"></div>
    <span style="font-size: 14px; font-weight: 600; color: #F5F3FA;">Conectando ao Busaí SP...</span>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
